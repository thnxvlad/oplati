linters-settings:
  revive:
    # Настройки стиля (имена переменных, комментарии и т.д.)
    ignore-generated-header: true
    severity: warning

linters:
  # Отключаем все по умолчанию и включаем только нужные
  disable-all: true
  enable:
    - errcheck    # Проверка необработанных ошибок
    - gosimple    # Предложения по упрощению кода
    - staticcheck # Статический анализ (баги, производительность)
    - revive      # Стилистика и именование
    - govet       # Стандартный анализатор Go
    - unused      # Поиск неиспользуемого кода

run:
  # Время ожидания перед тем, как линтер сдастся (для больших проектов)
  timeout: 5m
  # Проверять только те файлы, которые не в игноре
  tests: true

issues:
  # Максимальное количество жалоб от одного линтера
  max-issues-per-linter: 0
  # Максимальное количество жалоб всего
  max-same-issues: 0